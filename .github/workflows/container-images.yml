name: Container image supply chain

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and keyless-sign immutable GHCR images
        required: true
        type: boolean
        default: false
  push:
    tags:
      - container-v*
  pull_request:
    paths:
      - .github/workflows/container-images.yml
      - cmd/container-inventory/**
      - cmd/cyberstrike-egress/**
      - container/agent/**
      - container/egress/**
      - internal/boundary/**
      - internal/egress/**
      - internal/runtime/container/readiness.go
      - scripts/smoke-container-images.sh
      - scripts/verify-container-release.sh
      - go.mod
      - go.sum

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"

jobs:
  smoke:
    name: Smoke ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Prepare deterministic image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'created=%s\n' "$(git show -s --format=%cI "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"
          printf 'source=%s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >>"$GITHUB_OUTPUT"

      - name: Build Agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/agent/Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: cyberstrike-agent-smoke:latest
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            SOURCE_URL=${{ steps.metadata.outputs.source }}
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}

      - name: Build egress image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/egress/Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: cyberstrike-egress-smoke:latest
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            SOURCE_URL=${{ steps.metadata.outputs.source }}
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}

      - name: Run images under the target architecture
        shell: bash
        run: |
          scripts/smoke-container-images.sh \
            --agent cyberstrike-agent-smoke:latest \
            --egress cyberstrike-egress-smoke:latest \
            --platform '${{ matrix.platform }}' \
            --entries container/agent/tool-inventory.entries.json

  publish:
    name: Publish, attest, and sign
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/container-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deterministic release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          fi
          printf 'agent=ghcr.io/%s/cyberstrike-agent\n' "$owner" >>"$GITHUB_OUTPUT"
          printf 'egress=ghcr.io/%s/cyberstrike-egress\n' "$owner" >>"$GITHUB_OUTPUT"
          printf 'created=%s\n' "$(git show -s --format=%cI "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"
          printf 'source=%s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Build and push Agent image with attestations
        id: agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.agent }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.agent }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            SOURCE_URL=${{ steps.metadata.outputs.source }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=container-agent
          cache-to: type=gha,mode=max,scope=container-agent

      - name: Build and push egress image with attestations
        id: egress
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/egress/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.egress }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.egress }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            SOURCE_URL=${{ steps.metadata.outputs.source }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=container-egress
          cache-to: type=gha,mode=max,scope=container-egress

      - name: Sign image indexes and platform manifests
        env:
          AGENT_IMAGE: ${{ steps.metadata.outputs.agent }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          EGRESS_IMAGE: ${{ steps.metadata.outputs.egress }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for component in agent egress; do
            if [[ "$component" == agent ]]; then
              image=$AGENT_IMAGE
              digest=$AGENT_DIGEST
            else
              image=$EGRESS_IMAGE
              digest=$EGRESS_DIGEST
            fi
            docker buildx imagetools inspect --raw "$image@$digest" >"release/$component-index.json"
            cosign sign --yes "$image@$digest"
            for architecture in amd64 arm64; do
              platform_digest=$(jq -er --arg architecture "$architecture" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)] as $matches
                | if ($matches | length) == 1 then $matches[0].digest else error("platform manifest is missing or ambiguous") end
              ' "release/$component-index.json")
              cosign sign --yes "$image@$platform_digest"
            done
          done

      - name: Generate pinned inventories and checksum manifest
        env:
          AGENT_IMAGE: ${{ steps.metadata.outputs.agent }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          EGRESS_IMAGE: ${{ steps.metadata.outputs.egress }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            platform_digest=$(jq -er --arg architecture "$architecture" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)] as $matches
              | if ($matches | length) == 1 then $matches[0].digest else error("platform manifest is missing or ambiguous") end
            ' release/agent-index.json)
            go run ./cmd/container-inventory \
              -entries container/agent/tool-inventory.entries.json \
              -image-digest "$platform_digest" \
              -image-platform "linux/$architecture" \
              -output "release/agent-tool-inventory-linux-$architecture.json" \
              >"release/agent-tool-inventory-linux-$architecture.sha256"
          done
          jq -n \
            --arg agent "$AGENT_IMAGE@$AGENT_DIGEST" \
            --arg egress "$EGRESS_IMAGE@$EGRESS_DIGEST" \
            --arg revision "$GITHUB_SHA" \
            '{schemaVersion:1, revision:$revision, agent:$agent, egress:$egress}' \
            >release/images.json
          (
            cd release
            sha256sum \
              agent-index.json \
              egress-index.json \
              agent-tool-inventory-linux-amd64.json \
              agent-tool-inventory-linux-amd64.sha256 \
              agent-tool-inventory-linux-arm64.json \
              agent-tool-inventory-linux-arm64.sha256 \
              images.json >SHA256SUMS
          )

      - name: Sign and verify release checksum manifest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
          cosign verify-blob \
            --bundle release/SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/SHA256SUMS >/dev/null

      - name: Verify signatures, attestations, checksums, and both architectures
        env:
          AGENT_REF: ${{ steps.metadata.outputs.agent }}@${{ steps.agent.outputs.digest }}
          EGRESS_REF: ${{ steps.metadata.outputs.egress }}@${{ steps.egress.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          scripts/verify-container-release.sh \
            --agent "$AGENT_REF" \
            --egress "$EGRESS_REF" \
            --source '${{ steps.metadata.outputs.source }}' \
            --revision '${{ github.sha }}' \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --artifacts release \
            --bundle release/SHA256SUMS.sigstore.json \
            --smoke

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
